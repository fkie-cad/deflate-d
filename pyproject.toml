[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deflate-d"
version = "0.1.0"
description = "Token-efficient reformatting of decompiler output for LLM consumption"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fraunhofer FKIE" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[dependency-groups]
dev = ["pytest", "black", "isort"]

[project.scripts]
deflate-d = "deflated.reformat:main"

[tool.black]
line-length = 140
target-version = ["py311"]

[tool.isort]
profile = "black"
src_paths = ["deflated"]
line_length = 140

[tool.pytest.ini_options]
testpaths = ["deflated/tests"]

[tool.setuptools]
packages = ["deflated", "deflated.transforms", "deflated.examples"]

[tool.setuptools.package-data]
"deflated.examples" = ["*.c"]
